leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
center = ["active-window"]
trailing = ["media", "notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]

[workspaceBar]
position = "overlappingMenuBar"
height = 32
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 0.1
showItemBackgrounds = true
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0

[widgets.workspaces]
indicator = "underline"

[island]
root = "lake"
displays = "all"
width = 760
height = 360
fullscreen = "hide"

[[island.components]]
id = "music"
widget = "media"

[[island.components]]
id = "agenda"
widget = "calendar"

[[island.components]]
id = "forecast"
widget = "weather"

[[island.components]]
id = "power"
widget = "battery"

[[island.components]]
id = "london"
widget = "world-clock"
label = "London"
zone = "Europe/London"

[[island.components]]
id = "tokyo"
widget = "world-clock"
label = "Tokyo"
zone = "Asia/Tokyo"
