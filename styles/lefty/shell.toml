theme = "lefty"
leading = ["workspaces"]
center = []
trailing = []
hiddenBarWidget = "hidden-bar"
systemStatsWidget = "system-stats"

# cover paints an opaque strip over the macOS app menus, which a transparent bar would leave showing.
[widgets.workspaces]
indicator = "numbers"
cover = "surface"
coverWidth = 616

# The bar is as wide as its contents. OmniWM keeps it on screen, so these offsets pin it to the top left corner of any
# display whose menu bar is up to 40 pt tall.
[workspaceBar]
position = "overlappingMenuBar"
fullWidth = false
notchMode = "off"
height = 30
xOffset = -10000
yOffset = 10
reserveLayoutSpace = true
transparentBackground = true
solidBlackBackground = false
backgroundOpacity = 1
showItemBackgrounds = false
showAccentHighlights = true
showLabels = true
