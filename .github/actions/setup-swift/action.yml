name: Set up Swift
description: Restore the cached pinned Swift toolchain, or install it from scratch when the cache did not restore cleanly.
outputs:
  build-environment:
    description: Fingerprint of the Xcode, macOS SDK and operating system used for build caches.
    value: ${{ steps.build-environment.outputs.fingerprint }}
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: toolchain-cache
      with:
        path: |
          ~/.swiftly
          ~/Library/Developer/Toolchains
        key: swift-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version') }}
    - name: Discard a partly restored toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf ~/.swiftly ~/Library/Developer/Toolchains
    - name: Install the pinned Swift toolchain
      shell: bash
      run: ./Scripts/swift-toolchain.sh
    - name: Identify the build environment
      id: build-environment
      shell: bash
      run: |
        set -euo pipefail
        xcode_version="$(xcodebuild -version)"
        sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
        sdk_build="$(xcrun --sdk macosx --show-sdk-build-version)"
        os_build="$(sw_vers -buildVersion)"
        printf '%s\n' "$xcode_version" "$sdk_path" "$sdk_build" "$os_build"
        fingerprint="$(printf '%s\n' "$xcode_version" "$sdk_path" "$sdk_build" "$os_build" | shasum -a 256 | cut -d ' ' -f 1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
