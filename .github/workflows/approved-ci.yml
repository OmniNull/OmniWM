name: OmniWM CI
run-name: >-
  ${{ inputs.pr_number && format('PR #{0} {1} {2}', inputs.pr_number, inputs.head_sha, inputs.merge_sha) || format('Main CI {0}', github.sha) }}

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'website/**', '*.md']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Approved pull request number (set by approval policy)
        required: false
        type: string
      head_sha:
        description: Approved PR head commit
        type: string
      merge_sha:
        description: Approved immutable merge commit
        type: string

permissions:
  contents: read
  pull-requests: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  approval:
    name: Authorize exact source
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      checkout: ${{ steps.policy.outputs.checkout }}
      head: ${{ steps.policy.outputs.head }}
      base: ${{ steps.policy.outputs.base }}
      website: ${{ steps.policy.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check approval before running repository code
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_MERGE: ${{ inputs.merge_sha }}
        run: python3 Scripts/ci-approval.py authorize
  cache-dependencies:
    needs: approval
    name: Cache dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.approval.outputs.checkout }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
          save-release-downloads: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: build-cache
        with:
          path: .build/localization
          key: swift-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Scripts/build-metadata.env') }}-${{ github.sha }}
          restore-keys: swift-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Scripts/build-metadata.env') }}-
      - name: Date sources by their last commit
        env:
          CACHED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 Scripts/restore-mtimes.py "$CACHED_BUILD_KEY"
      - name: Build the app and test bundle
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift build --build-tests --build-system swiftbuild --arch arm64 --scratch-path .build/localization
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/localization
          key: swift-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Scripts/build-metadata.env') }}-${{ github.sha }}
  changes:
    needs: approval
    name: Changes
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.approval.outputs.checkout }}
          persist-credentials: false
      - name: Plan the Swift test groups
        id: plan
        env:
          EVENT: ${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}
          BASE: ${{ needs.approval.outputs.base }}
          HEAD: ${{ needs.approval.outputs.head }}
        run: |
          set -o pipefail
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only "$BASE...$HEAD"
          fi | python3 Scripts/ci_test_plan.py "$EVENT" >> "$GITHUB_OUTPUT"
  tooling:
    needs: approval
    name: Tooling
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 30
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.approval.outputs.checkout }}
          persist-credentials: false
      - name: Check pinned downloads
        run: make check-pins
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup-tools
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Check the flake
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix flake check
      - name: Verify formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Verify generated IPC wire files
        run: python3 Scripts/generate_ipc_wire.py --check
      - name: Test development tooling
        run: make test-dev-tools
  verify:
    name: Verify
    needs: [approval, changes]
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.approval.outputs.checkout }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: needs.changes.outputs.tests == 'true'
        id: build-cache
        with:
          path: .build/localization
          key: swift-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Scripts/build-metadata.env') }}-${{ github.sha }}
          restore-keys: swift-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Scripts/build-metadata.env') }}-
      - name: Date sources by their last commit
        if: needs.changes.outputs.tests == 'true'
        env:
          CACHED_BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 Scripts/restore-mtimes.py "$CACHED_BUILD_KEY"
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Audit ARC in the shell core
        run: make arc-audit
      - name: Build the app and test bundle once
        if: needs.changes.outputs.tests == 'true'
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift build --build-tests --build-system swiftbuild --arch arm64 --scratch-path .build/localization
      - name: Verify localization and build
        run: |
          ./Scripts/ghostty-preflight.sh verify
          python3 Scripts/localization.py check
      - name: Archive the test runtime
        if: needs.changes.outputs.tests == 'true'
        run: |
          scratch=.build/localization
          tar -cf "$RUNNER_TEMP/swift-tests.tar" \
            --exclude="$scratch/out/Intermediates.noindex" \
            --exclude="$scratch/out/ModuleCache.noindex" \
            --exclude="$scratch/out/SDKExplicitPrecompiledModules.noindex" \
            --exclude="$scratch/repositories" --exclude="$scratch/strings" \
            --exclude="$scratch/out/Products/Debug/index" \
            --exclude="$scratch/out/Products/Debug/*.a" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            "$scratch"
          tar -rhf "$RUNNER_TEMP/swift-tests.tar" Frameworks/GhosttyKit.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.changes.outputs.tests == 'true'
        with:
          name: swift-tests
          path: ${{ runner.temp }}/swift-tests.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
      - name: Compile the live checks
        if: needs.changes.outputs.tests == 'true'
        run: OMNIWM_LIVE_CHECKS=1 LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift build --build-tests --build-system swiftbuild --arch arm64 --scratch-path .build/localization
  test-group:
    name: Tests (${{ matrix.name }})
    needs: [approval, changes, verify]
    if: ${{ !cancelled() && needs.approval.result == 'success' && needs.changes.outputs.tests == 'true' && needs.verify.result == 'success' }}
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.approval.outputs.checkout }}
          persist-credentials: false
      - uses: ./.github/actions/setup-audio
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: swift-tests
      - name: Restore the test runtime
        run: tar -xf swift-tests.tar && rm swift-tests.tar
      - uses: ./.github/actions/setup-lix
        if: matrix.shells
        with:
          make-target: setup-tools
      - name: Put completion test shells on PATH
        if: matrix.shells
        run: |
          echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
          .cache/flake-tools/bin/fish --version
          .cache/flake-tools/bin/nu --version
      - name: Run the test group
        env:
          FLAG: ${{ matrix.flag }}
          PATTERN: ${{ matrix.pattern }}
        shell: bash
        run: |
          swift test --skip-build --build-system swiftbuild --arch arm64 --scratch-path .build/localization "$FLAG" "$PATTERN" 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -q "No matching test cases were run" "$RUNNER_TEMP/tests.log"; then
            echo "::error::$FLAG $PATTERN ran no tests."
            exit 1
          fi
  tests:
    name: Tests
    needs: [approval, changes, verify, test-group]
    if: ${{ !cancelled() && needs.approval.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      - name: Require every test group to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.tests }}
          VERIFY: ${{ needs.verify.result }}
          TEST_GROUPS: ${{ needs.test-group.result }}
        run: |
          if [[ "$REQUIRED" == true ]]; then
            [[ "$CHANGES" == success && "$VERIFY" == success && "$TEST_GROUPS" == success ]]
          else
            [[ "$CHANGES" == success && "$TEST_GROUPS" == skipped ]]
          fi || {
            echo "::error::Changes $CHANGES, verify $VERIFY, test groups $TEST_GROUPS."
            exit 1
          }
  website:
    name: Website
    needs: approval
    if: needs.approval.outputs.website == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.approval.outputs.checkout }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run reference:check
      - run: npm run check
      - run: npm run build
