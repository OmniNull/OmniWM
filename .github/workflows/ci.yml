name: OmniWM CI

on:
  # Always report existing check names so docs-only PRs can still merge.
  pull_request:
  push:
    branches: [main, '**-release']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check against its base branch (optional)
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  # Unique push groups also protect pending main runs from replacement.
  group: ${{ github.workflow }}-${{ (github.event.pull_request.number || inputs.pr_number) && format('pr-{0}', github.event.pull_request.number || inputs.pr_number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.plan.outputs.ci }}
      verify: ${{ steps.plan.outputs.verify }}
      tests: ${{ steps.plan.outputs.tests }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          persist-credentials: false
      - name: Plan the Swift test groups
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only "$BASE...$HEAD"
          elif [[ "$EVENT" == push && -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            git diff --name-only "$BASE" "$HEAD"
          else
            # Manual runs and new release branches receive the full checks.
            printf '%s\n' .github/workflows/ci.yml
          fi | python3 Scripts/ci_test_plan.py "$EVENT" >> "$GITHUB_OUTPUT"

  cache-dependencies:
    name: Cache dependencies
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ci == 'true'
    cache-mode: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift

  checks:
    name: Portable checks
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false
      - name: Check pinned downloads
        run: make check-pins
      - name: Install prebuilt style tools
        run: ./Scripts/ci-dependencies.sh style
      - name: Verify formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Verify generated IPC wire files
        run: python3 Scripts/generate_ipc_wire.py --check
      - name: Test development tooling
        run: make test-dev-tools

  tooling-macos:
    name: macOS tooling
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup-tools
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Check the macOS flake
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix flake check
      - name: Test macOS app packaging
        run: python3 -m unittest Tests.DevToolingTests.test_package_update_channel

  tooling:
    name: Tooling
    needs: [changes, checks, tooling-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all tooling checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.ci }}
          PORTABLE: ${{ needs.checks.result }}
          MACOS: ${{ needs.tooling-macos.result }}
        run: |
          [[ "$CHANGES" == success ]] || exit 1
          if [[ "$REQUIRED" == true ]]; then
            [[ "$PORTABLE" == success && "$MACOS" == success ]]
          else
            [[ "$PORTABLE" == skipped && "$MACOS" == skipped ]]
          fi

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - name: Install prebuilt GhosttyKit
        run: ./Scripts/ci-dependencies.sh ghostty
      - name: Build the app and test bundle once
        if: needs.changes.outputs.tests == 'true'
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift build --build-tests --arch arm64
      - name: Verify localization
        run: python3 Scripts/localization.py check
      - name: Archive the test runtime
        if: needs.changes.outputs.tests == 'true'
        run: |
          tar -cf "$RUNNER_TEMP/swift-tests.tar" \
            --exclude='.build/out/Intermediates.noindex' \
            --exclude='.build/out/ModuleCache.noindex' \
            --exclude='.build/out/SDKExplicitPrecompiledModules.noindex' \
            --exclude='.build/repositories' --exclude='.build/strings' \
            --exclude='.build/out/Products/Debug/index' \
            --exclude='.build/out/Products/Debug/*.a' \
            --exclude='*.o' --exclude='*.swiftmodule' \
            .build Frameworks/GhosttyKit.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.changes.outputs.tests == 'true'
        with:
          name: swift-tests
          path: ${{ runner.temp }}/swift-tests.tar
          compression-level: 1
          retention-days: 1
          overwrite: true

  test-group:
    name: Tests (${{ matrix.name }})
    needs: [changes, verify]
    if: ${{ !cancelled() && needs.changes.outputs.tests == 'true' && needs.verify.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: swift-tests
      - name: Restore the test runtime
        run: tar -xf swift-tests.tar && rm swift-tests.tar
      - name: Install prebuilt Nushell for completion tests
        if: matrix.completions == true
        run: |
          ./Scripts/ci-dependencies.sh nu
          echo "$PWD/.cache/ci-shells" >> "$GITHUB_PATH"
      - name: Run the test group
        env:
          FLAG: ${{ matrix.flag }}
          PATTERN: ${{ matrix.pattern }}
          OMNIWM_REDUCED_GLASS_SWEEP: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: swift test --skip-build --arch arm64 "$FLAG" "$PATTERN"

  tests:
    name: Tests
    needs: [changes, verify, test-group]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test group to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.tests }}
          VERIFY: ${{ needs.verify.result }}
          TEST_GROUPS: ${{ needs.test-group.result }}
        run: |
          [[ "$CHANGES" == success ]] || exit 1
          if [[ "$REQUIRED" == true ]]; then
            [[ "$VERIFY" == success && "$TEST_GROUPS" == success ]]
          else
            [[ "$TEST_GROUPS" == skipped ]]
          fi
