name: OmniWM CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'website/**', '*.md']
  push:
    branches: [main, '**-release']
    paths-ignore: ['docs/**', 'website/**', '*.md']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check against its base branch (optional)
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  cache-dependencies:
    name: Cache dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - name: Plan the Swift test groups
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only "$BASE...$HEAD"
          fi | python3 Scripts/ci_test_plan.py "$EVENT" >> "$GITHUB_OUTPUT"
  tooling:
    name: Tooling
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - name: Check pinned downloads
        run: make check-pins
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup-tools
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Check the flake
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix flake check
      - name: Verify formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Verify generated IPC wire files
        run: python3 Scripts/generate_ipc_wire.py --check
      - name: Test development tooling
        run: make test-dev-tools
  verify:
    name: Verify
    needs: changes
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Build the app and test bundle once
        if: needs.changes.outputs.tests == 'true'
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift build --build-tests --build-system swiftbuild --arch arm64 --scratch-path .build/localization
      - name: Verify localization and build
        run: |
          ./Scripts/ghostty-preflight.sh verify
          python3 Scripts/localization.py check
      - name: Archive the test runtime
        if: needs.changes.outputs.tests == 'true'
        run: |
          scratch=.build/localization
          tar -cf "$RUNNER_TEMP/swift-tests.tar" \
            --exclude="$scratch/out/Intermediates.noindex" \
            --exclude="$scratch/out/ModuleCache.noindex" \
            --exclude="$scratch/out/SDKExplicitPrecompiledModules.noindex" \
            --exclude="$scratch/repositories" --exclude="$scratch/strings" \
            --exclude="$scratch/out/Products/Debug/index" \
            --exclude="$scratch/out/Products/Debug/*.a" \
            --exclude='*.o' --exclude='*.swiftmodule' \
            "$scratch"
          tar -rhf "$RUNNER_TEMP/swift-tests.tar" Frameworks/GhosttyKit.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.changes.outputs.tests == 'true'
        with:
          name: swift-tests
          path: ${{ runner.temp }}/swift-tests.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
  test-group:
    name: Tests (${{ matrix.name }})
    needs: [changes, verify]
    if: ${{ !cancelled() && needs.changes.outputs.tests == 'true' && needs.verify.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: swift-tests
      - name: Restore the test runtime
        run: tar -xf swift-tests.tar && rm swift-tests.tar
      - uses: ./.github/actions/setup-lix
        if: matrix.shells
        with:
          make-target: setup-tools
      - name: Put completion test shells on PATH
        if: matrix.shells
        run: |
          echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
          .cache/flake-tools/bin/fish --version
          .cache/flake-tools/bin/nu --version
      - name: Run the test group
        env:
          FLAG: ${{ matrix.flag }}
          PATTERN: ${{ matrix.pattern }}
        run: swift test --skip-build --build-system swiftbuild --arch arm64 --scratch-path .build/localization "$FLAG" "$PATTERN"
  tests:
    name: Tests
    needs: [changes, verify, test-group]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test group to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.tests }}
          VERIFY: ${{ needs.verify.result }}
          TEST_GROUPS: ${{ needs.test-group.result }}
        run: |
          if [[ "$REQUIRED" == true ]]; then
            [[ "$CHANGES" == success && "$VERIFY" == success && "$TEST_GROUPS" == success ]]
          else
            [[ "$CHANGES" == success && "$TEST_GROUPS" == skipped ]]
          fi || {
            echo "::error::Changes $CHANGES, verify $VERIFY, test groups $TEST_GROUPS."
            exit 1
          }
