name: OmniWM CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'website/**', '*.md']
  push:
    branches: [main, '**-release']
    paths-ignore: ['docs/**', 'website/**', '*.md']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check against its base branch (optional)
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  cache-dependencies:
    name: Cache dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.paths.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip the Swift suite for tooling only changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tests=false
          paths="$(git diff --name-only "$BASE...$HEAD")"
          while IFS= read -r path; do
            case "$path" in
              docs/* | website/* | Tests/DevToolingTests/*) ;;
              Scripts/*/*) tests=true ;;
              Scripts/*.py) ;;
              */*) tests=true ;;
              *.md) ;;
              *) tests=true ;;
            esac
          done <<< "$paths"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
  tooling:
    name: Tooling
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - name: Check pinned downloads
        run: make check-pins
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup-tools
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Check the flake
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: nix flake check
      - name: Verify formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Verify generated IPC wire files
        run: python3 Scripts/generate_ipc_wire.py --check
      - name: Test development tooling
        run: make test-dev-tools
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Verify localization and build
        run: make localization-check
  tests:
    name: Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tests != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup
      - name: Put flake tools on PATH
        run: echo "$PWD/.cache/flake-tools/bin" >> "$GITHUB_PATH"
      - name: Check completion test shells
        run: |
          fish --version
          nu --version
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Run the serial test suite
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift test
