name: Approval policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [PR review signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Recheck approvals or verify GitHub permission access
        type: choice
        options: [reconcile, verify-access]
        default: reconcile

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: write

concurrency:
  group: approval-policy
  cancel-in-progress: false

jobs:
  policy:
    if: github.repository == 'OmniNull/OmniWM' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate current reviews and authorize CI
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'reconcile' }}
        run: python3 Scripts/ci-approval.py "$MODE"
