name: OmniWM canary

# Publishes main HEAD as an automated signed and notarized prerelease for
# testers. Daily schedule; runs become no-ops when nothing new landed after
# the newest canary or stable tag. A manual dispatch can force a rebuild.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when main has no app commits after the newest canary or release tag
        type: boolean
        default: false

permissions: {}

concurrency:
  # Shared with the release workflow so a canary never interleaves with a
  # stable release on the same runner and Apple account.
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  OMNIWM_RELEASE_SIGNING_IDENTITY: "${{ vars.OMNIWM_RELEASE_SIGNING_IDENTITY || 'Developer ID Application: Oliver Nikolic (VF8LDJRGFM)' }}"
  OMNIWM_RELEASE_NOTARIZE_PROFILE: ${{ vars.OMNIWM_RELEASE_NOTARIZE_PROFILE || 'OmniWM-Notarize' }}
  OMNIWM_NOTARIZE_TIMEOUT: 30m

jobs:
  prereq:
    name: Check canary signing setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.environment.outputs.ready }}
    steps:
      - name: Require the canary-signing environment
        id: environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A 404 can also mean denied access; skip only after a successful list.
          READY="$(gh api "repos/$GITHUB_REPOSITORY/environments?per_page=100" --paginate --slurp \
            | jq 'any(.[].environments[]; .name == "canary-signing")')"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" == "false" ]]; then
            {
              printf '## Canary disabled\n\n'
              printf 'The `canary-signing` environment does not exist yet. Create it with the same five `APPLE_*`\n'
              printf 'secrets as `release-signing`, no required reviewers, and a selected-branches deployment\n'
              printf 'policy that only allows `main`. The daily schedule stays green while it is missing.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  canary:
    name: Build and publish a canary
    needs: prereq
    # Scheduled workflows also fire on forks; only the upstream repo signs.
    if: github.repository == 'OmniNull/OmniWM' && github.ref == 'refs/heads/main' && needs.prereq.outputs.ready == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    # Deliberately not release-signing: that environment requires the owner
    # review every stable release needs, and a daily schedule must not queue
    # on it. Create the canary-signing environment with the same five APPLE_*
    # secrets, no required reviewers, and a selected-branches policy for main.
    environment: canary-signing
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Assert canonical token-free origin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git remote get-url origin)" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ]]; then
            echo '::error::origin must be the canonical token-free checkout URL.'
            exit 1
          fi
      - name: Decide whether main has anything new to canary
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FORCE_ARG=""
          if [[ "$FORCE" == "true" ]]; then
            FORCE_ARG="--force"
          fi
          python3 Scripts/canary_release.py check --github-output "$GITHUB_OUTPUT" $FORCE_ARG
      - name: Require passing CI for the checked-out commit
        id: verify
        if: steps.check.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/canary_release.py verify-ci
      - uses: ./.github/actions/setup-swift
        if: steps.check.outputs.should_skip != 'true'
      - uses: ./.github/actions/setup-lix
        if: steps.check.outputs.should_skip != 'true'
        with:
          make-target: setup
      # Imported after dependency setup and removed before any later action step.
      - name: Import signing and notarization credentials
        if: steps.check.outputs.should_skip != 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN_PASSWORD
          ./Scripts/release-ci-credentials.sh
      - name: Build, sign and notarize the canary app
        id: build
        if: steps.check.outputs.should_skip != 'true'
        env:
          OMNIWM_SIGNING_IDENTITY: ${{ env.OMNIWM_RELEASE_SIGNING_IDENTITY }}
          OMNIWM_NOTARIZE_PROFILE: ${{ env.OMNIWM_RELEASE_NOTARIZE_PROFILE }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M)"
          TAG="canary-$STAMP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          OMNIWM_CANARY_TAG="$TAG" Scripts/package-app.sh release true
      - name: Publish the canary prerelease
        id: publish
        if: steps.check.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          STAMP: ${{ steps.build.outputs.stamp }}
        run: |
          set -euo pipefail
          # The tag must name the commit the ZIP and notes were built from;
          # checkout of main can be newer than the event's GITHUB_SHA.
          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          python3 Scripts/canary_release.py notes --repo . --output "$RUNNER_TEMP/canary-notes.md"
          ZIP="dist/OmniWM-canary-$TAG.zip"
          ditto -c -k --keepParent dist/OmniWM.app "$ZIP"
          URL="$(gh release create "$TAG" "$ZIP" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Canary $STAMP ($SHORT)" \
            --notes-file "$RUNNER_TEMP/canary-notes.md")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Remove release credentials
        if: always()
        run: |
          if [[ -f Scripts/release-ci-credentials.sh ]]; then
            ./Scripts/release-ci-credentials.sh cleanup
          fi
      - name: Summarize
        if: always()
        env:
          SHOULD_SKIP: ${{ steps.check.outputs.should_skip }}
          SKIP_REASON: ${{ steps.check.outputs.skip_reason }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISHED_TAG: ${{ steps.publish.outputs.tag }}
          PUBLISHED_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          {
            if [[ "$SHOULD_SKIP" == "true" ]]; then
              printf '## Canary skipped\n\n%s\n' "$SKIP_REASON"
            elif [[ "$VERIFY_OUTCOME" == "failure" ]]; then
              printf '## Canary blocked\n\nCI verification failed for the checked-out commit. See the **Require passing CI for the checked-out commit** step in [this run](%s/%s/actions/runs/%s).\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            elif [[ -n "$PUBLISHED_TAG" ]]; then
              printf '## Canary published\n\n- Tag: `%s`\n- Release: %s\n' "$PUBLISHED_TAG" "$PUBLISHED_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ghostty-intel:
    name: Build pinned GhosttyKit for Intel
    needs: canary
    if: needs.canary.outputs.tag != ''
    runs-on: xcode-27
    timeout-minutes: 90
    # No signing environment: the Ghostty build never sees Apple credentials.
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.canary.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lix
      - name: Install translation build tools
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          gettext_out="$(nix build --no-link --print-out-paths .#gettext)"
          echo "${gettext_out}/bin" >> "$GITHUB_PATH"
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent metalToolchain
      - name: Build the pinned Ghostty revision for x86_64
        run: |
          set -euo pipefail
          REVISION="$(sed -n 's/^OMNIWM_GHOSTTY_SOURCE_COMMIT=//p' Scripts/dev-tools.env)"
          python3 Scripts/build-ghosttykit.py --arch x86_64 --revision "$REVISION" --output-dir .build/intel-ghostty
      - name: Upload source build and provenance
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghosttykit-x86_64-${{ github.run_id }}
          path: |
            .build/intel-ghostty/GhosttyKit.xcframework.zip
            .build/intel-ghostty/provenance.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  canary-intel:
    name: Build and attach the Intel canary
    needs: [canary, ghostty-intel]
    runs-on: xcode-27
    timeout-minutes: 90
    environment: canary-signing
    permissions:
      contents: write
    env:
      OMNIWM_ARCH: x86_64
      TAG: ${{ needs.canary.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.canary.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
      - uses: ./.github/actions/setup-lix
        with:
          make-target: setup-tools
      - name: Download the Intel GhosttyKit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.ghostty-intel.outputs.artifact_id }}
          merge-multiple: true
          path: .build/intel-ghostty
      - name: Install the Intel GhosttyKit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".build/intel-ghostty")
          provenance = json.loads((root / "provenance.json").read_text())
          pins = dict(line.split("=", 1) for line in Path("Scripts/dev-tools.env").read_text().splitlines() if "=" in line)
          archive = hashlib.sha256((root / "GhosttyKit.xcframework.zip").read_bytes()).hexdigest()
          if provenance["source_revision"] != pins["OMNIWM_GHOSTTY_SOURCE_COMMIT"] or provenance["architecture"] != "x86_64":
              raise SystemExit("Intel GhosttyKit was not built from the pinned revision for x86_64")
          if archive != provenance["zip_sha256"]:
              raise SystemExit("Intel GhosttyKit ZIP differs from its provenance")
          digest = provenance["framework_files"]["macos-x86_64/libghostty-internal.a"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OMNIWM_GHOSTTY_X86_64_ARCHIVE_SHA256={digest}\n")
          PY
          mkdir -p Frameworks
          ditto -x -k .build/intel-ghostty/GhosttyKit.xcframework.zip Frameworks
      - name: Check the Intel GhosttyKit
        run: ./Scripts/ghostty-preflight.sh verify
      # Imported after dependency setup and removed before any later action step.
      - name: Import signing and notarization credentials
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN_PASSWORD
          ./Scripts/release-ci-credentials.sh
      - name: Build, sign and notarize the Intel canary app
        env:
          OMNIWM_SIGNING_IDENTITY: ${{ env.OMNIWM_RELEASE_SIGNING_IDENTITY }}
          OMNIWM_NOTARIZE_PROFILE: ${{ env.OMNIWM_RELEASE_NOTARIZE_PROFILE }}
        run: OMNIWM_CANARY_TAG="$TAG" Scripts/package-app.sh release true
      - name: Attach the Intel app to the canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/OmniWM-canary-$TAG-x86_64.zip"
          ditto -c -k --keepParent dist/OmniWM.app "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          printf '## Intel canary attached\n\n- Tag: `%s`\n- Asset: `%s`\n' "$TAG" "${ZIP#dist/}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove release credentials
        if: always()
        run: |
          if [[ -f Scripts/release-ci-credentials.sh ]]; then
            ./Scripts/release-ci-credentials.sh cleanup
          fi
