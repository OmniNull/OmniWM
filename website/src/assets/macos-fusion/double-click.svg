<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="What a double-click does on each part of a window" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>What a double-click does on each part of a window</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="340" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Double-click a window's edge or title bar</text><g><rect x="210" y="60" width="260" height="220" rx="6" fill="#B9D3F5" stroke="#00000022" stroke-width="1"/><path d="M210 76 V66 a6 6 0 0 1 6 -6 H464 a6 6 0 0 1 6 6 V76 z" fill="#000" fill-opacity="0.09"/><circle cx="218" cy="68" r="2.6" fill="#FF5F57"/><circle cx="226" cy="68" r="2.6" fill="#FEBC2E"/><circle cx="234" cy="68" r="2.6" fill="#28C840"/></g><rect x="210" y="56.0" width="260" height="8" fill="#2F7DF6" fill-opacity="0.45"/><rect x="210" y="276.0" width="260" height="8" fill="#2F7DF6" fill-opacity="0.45"/><rect x="206.0" y="60" width="8" height="220" fill="#F59E0B" fill-opacity="0.55"/><rect x="466.0" y="60" width="8" height="220" fill="#F59E0B" fill-opacity="0.55"/><rect x="250" y="64" width="210" height="20" rx="4" fill="#16A34A" fill-opacity="0.25" stroke="#16A34A" stroke-dasharray="3 2"/><text x="355.0" y="78" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">title bar</text><text x="500" y="64" font-size="12" font-weight="700" fill="#2F7DF6" text-anchor="start">Top or bottom edge</text><text x="500" y="80" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">Lone window: full column height</text><text x="500" y="95" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">Stack: becomes tabs, and back</text><line x1="470" y1="60" x2="494" y2="60" stroke="#2F7DF6" stroke-width="1"/><text x="500" y="140" font-size="12" font-weight="700" fill="#16A34A" text-anchor="start">Title bar</text><text x="500" y="156" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">Full width</text><text x="500" y="171" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">Again: back to how it was</text><line x1="460" y1="74" x2="494" y2="140" stroke="#16A34A" stroke-width="1"/><text x="30" y="210" font-size="12" font-weight="700" fill="#B45309" text-anchor="start">Left or right edge</text><text x="30" y="226" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">Stretch that side to</text><text x="30" y="241" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">the screen edge;</text><text x="30" y="256" font-size="11" font-weight="400" fill="#1F2329" text-anchor="start">again: earlier width</text><line x1="150" y1="220" x2="204" y2="210" stroke="#B45309" stroke-width="1"/><text x="360" y="325" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Double-clicks on buttons, fields and tabs in the title bar still go to the app.</text></svg>