<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Moving, pulling out and adding tabs in a tabbed column" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Moving, pulling out and adding tabs in a tabbed column</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="340" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Tabbed columns</text><circle cx="39" cy="58" r="9" fill="#2F7DF6"/><text x="39" y="62" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="56" y="62" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Title bar: move all tabs</text><rect x="27" y="73" width="206" height="236" rx="6" fill="#2B2F36"/><rect x="30" y="76" width="200" height="230" rx="3" fill="#E7EBF1"/><rect x="30" y="76" width="200" height="7" fill="#D3D8E0"/><clipPath id="c1"><rect x="30" y="76" width="200" height="230" rx="3"/></clipPath><rect x="45" y="93" widt