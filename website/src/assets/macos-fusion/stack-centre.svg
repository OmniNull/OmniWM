<circle cx="576" cy="108" r="2.6" fill="#FF5F57"/><circle cx="584" cy="108" r="2.6" fill="#FEBC2E"/><circle cx="592" cy="108" r="2.6" fill="#28C840"/><text x="623.0" y="214.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Browser</text></g><g filter="url(#lift)"><rect x="435.0" y="220" width="100" height="64" rx="6" fill="#F7E3A1" stroke="#2F7DF6" stroke-width="2.5"/><path d="M435.0 236 V226 a6 6 0 0 1 6 -6 H529.0 a6 6 0 0 1 6 6 V236 z" fill="#000" fill-opacity="0.09"/><circle cx="443.0" cy="228" r="2.6" fill="#FF5F57"/><circle cx="451.0" cy="228" r="2.6" fill="#FEBC2E"/><circle cx="459.0" cy="228" r="2.6" fill="#28C840"/><text x="485.0" y="264.0" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Notes</text></g><path d="M485.0 226 l0 17.0 l4.2 -4.0 l3.0 6.6 l2.6 -1.2 l-3.0 -6.5 l5.8 0 z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><rect x="410" y="274" width="150" height="31" rx="5" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 3"/><rect x="447.0" y="280.5" width="76" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.92"/><text x="485.0" y="292.5" font-size="10" font-weight="600" fill="#16A34A" text-anchor="middle">landing hint</text><text x="360" y="345" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Let go while the hint shows to stack. Move to a side third and the hint closes.</text></svg>