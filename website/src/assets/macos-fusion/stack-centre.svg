<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Free-style stacking: a landing hint opens above or below the window under the pointer" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Free-style stacking: a landing hint opens above or below the window under the pointer</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="360" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Rest in the middle third of a window to stack onto it</text><circle cx="59" cy="66" r="9" fill="#2F7DF6"/><text x="59" y="70" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76" y="70" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Top half: the hint opens above</text><rect x="47" y="81" width="306" height="236" rx="6" fill="#2B2F36"/><rect x="50" y="84" width="300" height="230" rx="3" fill="#E7EBF1"/><rect x="50" y="84" width="300" height="7" fill="#D3D8E0"/><clipPath id="c1"><rect x="50" y="84" width="300" height="230" rx="3"/></clipPath><rect x="70" y="100" width="150" height="31" rx="5" fill="url(#hatchGreen)" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="4 3"/><g><rect x="70" y="137" width="150" height="168" rx="6" fill="#B9D3F5" stroke="#00000022" stroke-width="1"/><path d="M70 153 V143 a6 6 0 0 1 6 -6 H214 a6 6 0 0 1 6 6 V153 z" fill="#000" fill-opacity="0.09"/><circle cx="78" cy="145" r="2.6" fill="#FF5F57"/><circle cx="86" cy="145" r="2.6" fill="#FEBC2E"/><circle cx="94" cy="145" r="2.6" fill="#28C840"/><text x="145.0" y="233.0" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Editor</text></g><line x1="120.0" y1="159" x2="120.0" y2="301" stroke="#6B7280" stroke-dasharray="3 3" stroke-width="1"/><line x1="170.0" y1="159" x2="170.0" y2="301" stroke="#6B7280" stroke-dasharray="3 3" stroke-width="1"/><g><rect x="228" y="100" width="110" height="205" rx="6" fill="#F6C9A8" stroke="#00000022" stroke-width="1"/><path d="M228 116 V106 a6 6 0 0 1 6 -6 H332 a6 6 0 0 1 6 6 V116 z" fill="#000" fill-opacity="0.09"/><circle cx="236" cy="108" r="2.6" fill="#FF5F57"/><circle cx="244" cy="108" r="2.6" fill="#FEBC2E"/><circle cx="252" cy="108" r="2.6" fill="#28C840"/><text x="283.0" y="214.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Browser</text></g><g filter="url(#lift)"><rect x="95.0" y="159" width="100" height="64" rx="6" fill="#F7E3A1" stroke="#2F7DF6" stroke-width="2.5"/><path d="M95.0 175 V165 a6 6 0 0 1 6 -6 H189.0 a6 6 0 0 1 6 6 V175 z" fill="#000" fill-opacity="0.09"/><circle cx="103.0" cy="167" r="2.6" fill="#FF5F57"/><circle cx="111.0" cy="167" r="2.6" fill="#FEBC2E"/><circle cx="119.0" cy="167" r="2.6" fill="#28C840"/><text x="145.0" y="203.0" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Notes</text></g><path d="M145.0 165 l0 17.0 l4.2 -4.0 l3.0 6.6 l2.6 -1.2 l-3.0 -6.5 l5.8 0 z