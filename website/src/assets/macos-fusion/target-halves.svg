<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Left half lands the window on the left, right half on the right" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Left half lands the window on the left, right half on the right</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="250" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">The half you pause on picks the side the window lands on</text><rect x="57" y="45" width="646" height="156" rx="6" fill="#2B2F36"/><rect x="60" y="48" width="640" height="150" rx="3" fill="#E7EBF1"/><rect x="60" y="48" width="640" height="7" fill="#D3D8E0"/><clipPath id="c1"><rect x="60" y="48" width="640" height="150" rx="3"/></clipPath><g><rect x="74" y="64" width="248" height="125" rx="6" fill="#F6C9A8" stroke="#00000022" stroke-width="1"/><path d="M74 80 V70 a6 6 0 0 1 6 -6 H316 a6 6 0 0 1 6 6 V80 z" fill="#000" fill-opacity="0.09"/><circle cx="82" cy="72" r="2.6" fill="#FF5F57"/><circle cx="90" cy="72" r="2.6" fill="#FEBC2E"/><circle cx="98" cy="72" r="2.6" fill="#28C840"/><text x="198.0" y="138.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Browser</text></g><g><rect x="330" y="64" width="220" height="125" rx="6" fill="#B9D3F5" stroke="#00000022" stroke-width="1"/><path d="M330 80 V70 a6 6 0 0 1 6 -6 H544 a6 6 0 0 1 6 6 V80 z" fill="#000" fill-opacity="0.09"/><circle cx="338" cy="72" r="2.6" fill="#FF5F57"/><circle cx="346" cy="72" r="2.6" fill="#FEBC2E"/><circle cx="354" cy="72" r="2.6" fill="#28C840"/></g><text x="440.0" y="98" font-size="12" font-weight="600" fill="#1F2329" text-anchor="middle">Editor</text><rect x="330" y="80" width="110.0" height="109" fill="#2F7DF6" fill-opacity="0.10"/><line x1="440.0" y1="84" x2="440.0" y2="185" stroke="#2F7DF6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="385.0" y="175" font-size="11" font-weight="600" fill="#2F7DF6" text-anchor="middle">left half</text><text x="495.0" y="175" font-size="11" font-weight="600" fill="#2F7DF6" text-anchor="middle">right half</text><g><rect x="558" y="64" width="140" height="125" rx="6" fill="#C9E7C0" stroke="#00000022" stroke-width="1"/><path d="M558 80 V70 a6 6 0 0 1 6 -6 H692 a6 6 0 0 1 6 6 V80 z" fill="#000" fill-opacity="0.09"/><circle cx="566" cy="72" r="2.6" fill="#FF5F57"/><circle cx="574" cy="72" r="2.6" fill="#FEBC2E"/><circle cx="582" cy="72" r="2.6" fill="#28C840"/><text x="628.0" y="138.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Terminal</text></g><text x="385.0" y="220" font-size="11" font-weight="400" fill="#1F2329" text-anchor="middle">lands left of Editor</text><text x="495.0" y="220" font-size="11" font-weight="400" fill="#1F2329" text-anchor="middle">lands right of Editor</text><path d="M385.0 126 L328 126" fill="none" stroke="#2F7DF6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495.0 126 L554 126" fill="none" stro