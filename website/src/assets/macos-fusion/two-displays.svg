<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Dragging a window onto another display's strip" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Dragging a window onto another display's strip</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="280" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">Carry a window to another display's strip</text><rect x="37" y="57" width="306" height="156" rx="6" fill="#2B2F36"/><rect x="40" y="60" width="300" height="150" rx="3" fill="#E7EBF1"/><rect x="40" y="60" width="300" height="7" fill="#D3D8E0"/><text x="190.0" y="228" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Display 1</text><clipPath id="c1"><rect x="40" y="60" width="300" height="150" rx="3"/></clipPath><rect x="343" y="57" width="306" height="156" rx="6" fill="#2B2F36"/><rect x="346" y="60" width="300" height="150" rx="3" fill="#E7EBF1"/><rect x="346" y="60" width="300" height="7" fill="#D3D8E0"/><text x="496.0" y="228" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Display 2</text><clipPath id="c2"><rect x="346" y="60" width="300" height="150" rx="3"/></clipPath><g><rect x="52" y="76" width="130" height="125" rx="6" fill="#F6C9A8" stroke="#00000022" stroke-width="1"/><path d="M52 92 V82 a6 6 0 0 1 6 -6 H176 a6 6 0 0 1 6 6 V92 z" fill="#000" fill-opacity="0.09"/><circle cx="60" cy="84" r="2.6" fill="#FF5F57"/><circle cx="68" cy="84" r="2.6" fill="#FEBC2E"/><circle cx="76" cy="84" r="2.6" fill="#28C840"/><text x="117.0" y="150.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Browser</text></g><g><rect x="190" y="76" width="138" height="125" rx="6" fill="#B9D3F5" stroke="#00000022" stroke-width="1"/><path d="M190 92 V82 a6 6 0 0 1 6 -6 H322 a6 6 0 0 1 6 6 V92 z" fill="#000" fill-opacity="0.09"/><circle cx="198" cy="84" r="2.6" fill="#FF5F57"/><circle cx="206" cy="84" r="2.6" fill="#FEBC2E"/><circle cx="214" cy="84" r="2.6" fill="#28C840"/><text x="259.0" y="150.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Editor</text></g><g><rect x="358" y="76" width="120" height="125" rx="6" fill="#E3C9F0" stroke="#00000022" stroke-width="1"/><path d="M358 92 V82 a6 6 0 0 1 6 -6 H472 a6 6 0 0 1 6 6 V92 z" fill="#000" fill-opacity="0.09"/><circle cx="366" cy="84" r="2.6" fill="#FF5F57"/><circle cx="374" cy="84" r="2.6" fill="#FEBC2E"/><circle cx="382" cy="84" r="2.6" fill="#28C840"/><text x="418.0" y="150.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Mail</text></g><rect x="486" y="76" width="26" height="125" rx="5" fill="url(#hatch)" stroke="#2F7DF6" stroke-width="1.6" stroke-dasharray="4 3"/><g><rect x="520" y="76" width="114" height="125" rx="6" fill="#F5B8C4" stroke="#00000022" stroke-width="1"/><path d="M520 92 V82 a6 6 0 0 1 6 -6 H628 a6 6 0 0 1 6 6 V92 z" fill="#000" fill-opacity="0.09"/><circle cx="528" cy="84" r="2.6" fill="#FF5F57"/><circle cx="536" cy="84" r="2.6" fill="#FEBC2E"/><circle cx="544" cy="84" r="2.6" fill="#28C840"/><text x="577.0" y="150.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Music</text></g><g filter="url(#lift)"><rect x="446" y="70" width="110" height="115" rx="6" fill="#F7E3A1" stroke="#2F7DF6" stroke-width="2.5"/><path d="M446 86 V76 a6 6 0 0 1 6 -6 H550 a6 6 0 0 1 6 6 V86 z" fill="#000" fill-opacity="0.09"/><circle cx="454" cy="78" r="2.6" fill="#FF5F57"/><circle cx="462" cy="78" r="2.6" fill="#FEBC2E"/><circle cx="470" cy="78" r="2.6" fill="#28C840"/><text x="501.0" y="139.5" font-size="12" font-weight="600" fill="#1F2329" fill-opacity="0.75" text-anchor="middle">Notes</text></g><path d="M496 76 l0 17.0 l4.2 -4.0 l3.0 6.6 l2.6 -1.2 l-3.0 -6.5 l5.8 0 z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><rect x="486" y="76" width="26" height="125" rx="5" fill="none" stroke="#2F7DF6" stroke-width="2" stroke-dasharray="4 3"/><path d="M260 244 Q373.0 264.0 486 244" fill="none" stroke="#2F7DF6" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="337" y="57" width="12" height="156" fill="#2F7DF6" fill-opacity="0.25"/><text x="360" y="280" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">At the shared edge the pointer is held while the strip can still scroll; push on to cross.</text></svg>