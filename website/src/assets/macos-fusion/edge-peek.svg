<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" height="256" role="img" aria-label="Edge peek: part of the next window shows at each screen edge" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Edge peek: part of the next window shows at each screen edge</title><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DF6"/></marker><marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2329"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F7DF6" stroke-width="2" stroke-opacity="0.35"/></pattern><pattern id="hatchGreen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16A34A" stroke-width="2" stroke-opacity="0.35"/></pattern></defs><rect width="720" height="256" rx="12" fill="#FFFFFF"/><text x="30" y="30" font-size="13" font-weight="600" fill="#1F2329" text-anchor="start">A strip of the next window stays in view at each edge with more windows</text><rect x="57" y="47" width="646" height="156" rx="6" fill="#2B2F36"/><rect x="60" y="50" width="640" height="150" rx="3" fill="#E7EBF1"/><rect x="60" y="50" width="640" height="7" fill="#D3D8E0"/><clipPath id="c1"><rect x="60" y="50" width="640" height="150" rx="3"/></clipPath><g opacity="0.38"><rect x="-114" y="66" width="200" height="125" rx="6" fill="#E3C9F0" stroke="#00000022" stroke-width="1"/><path d="M-114 82 V72 a6 6 0 0 1 6 -6 H80 a6 6 0 0 1 6 6 V82 z" fill="#000" fill-opacity="0.0