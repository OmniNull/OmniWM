theme = "native"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
center = ["active-window"]
trailing = ["media", "notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]
priority = ["workspaces", "app-menu", "apple-menu", "clock", "control-center", "omniwm", "hidden-bar", "battery-details", "wifi", "volume", "notifications", "scratchpads", "system-stats", "media", "active-window"]
hiddenBarWidget = "hidden-bar"
systemStatsWidget = "system-stats"

[island]
root = "focus-ribbon"
displays = "all"
width = 620
height = 200
fullscreen = "hide"

[workspaceBar]
position = "overlappingMenuBar"
height = 32
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 0
showItemBackgrounds = false
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0
systemStatsButton = true
