theme = "matrix"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads", "active-window"]
center = ["clock"]
trailing = ["privacy", "media", "wifi", "battery-details", "control-center"]
hiddenBarWidget = "hidden-bar"
systemStatsWidget = "system-stats"

[barShader]
source = "matrix-rain.metal"
fps = 30
values = [0.38, 1, 12, 1]

[widgets.workspaces]
compact = true
indicator = "numbers"

[widgets.active-window]
display = "text_only"
maxWidth = 160

[workspaceBar]
position = "belowMenuBar"
height = 40
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
showItemBackgrounds = false
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0
barFill = "background"
barBorder = "border"
