theme = "wayline"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
center = ["clock"]
trailing = ["media", "calendar", "weather", "volume", "battery", "system-stats"]

[workspaceBar]
height = 40
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
showItemBackgrounds = true
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0
barFill = "surface"
barBorder = "border"
