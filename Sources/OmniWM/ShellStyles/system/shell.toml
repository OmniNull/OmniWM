theme = "native"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
center = ["active-window"]
trailing = ["privacy", "wifi", "battery-details", "control-center", "clock"]
hiddenBarWidget = "hidden-bar"
systemStatsWidget = "system-stats"

[island]
root = "focus-ribbon"
displays = "all"
width = 620
height = 200
fullscreen = "hide"

[widgets.workspaces]
compact = true

[workspaceBar]
position = "belowMenuBar"
height = 32
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 0
showItemBackgrounds = false
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
xOffset = 0
yOffset = 0
