theme = "celestial"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
center = ["active-window"]
trailing = ["hidden-bar", "clock", "status", "system-stats", "power"]

[workspaceBar]
position = "left"
height = 60
fullWidth = true
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
barFill = "background"
showItemBackgrounds = true
showAccentHighlights = true
solidBlackBackground = false
showLabels = false
xOffset = 0
yOffset = 0

[drawer.dashboard]
edge = "top"
widgets = ["dashboard"]
hover = true
width = 900
close = "leave"
chrome = false
