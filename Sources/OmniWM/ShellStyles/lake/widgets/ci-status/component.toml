title = "CI status"
icon = "checkmark.circle"
views = ["compact", "expanded"]
capabilities = { network = ["api.github.com"] }

[options.repo]
type = "string"
title = "Repository (owner/name)"
default = "OmniNull/OmniWM"
maxLength = 140

[options.interval]
type = "number"
title = "Poll interval (seconds)"
default = 60
min = 15
max = 3600
step = 1
